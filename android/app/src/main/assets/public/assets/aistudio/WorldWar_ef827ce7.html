<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>WorldWar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--panel:#131b30;--panel2:#1a2440;--panel3:#222e52;--line:#2a3658;--fg:#eaf0fb;--dim:#8d9ac0;--gold:#f6c744;--gold2:#9a7a15;--good:#5be08a;--bad:#ff6b6b;--blue:#2f86d6;--f1:'Pixelify Sans',ui-monospace,monospace;--f2:'Press Start 2P',ui-monospace,monospace;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--f1);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:var(--f1);touch-action:manipulation;color:inherit}
svg.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:square;stroke-linejoin:miter}
svg.ic.f{fill:currentColor;stroke:none}
#app{height:100%;display:flex;flex-direction:column}
/* ---------- HUD ---------- */
#hud{display:flex;gap:6px;padding:6px 8px;background:linear-gradient(#18223d,#121a30);border-bottom:2px solid var(--line);align-items:stretch;flex:none}
.hb{flex:none;width:46px;min-height:46px;display:grid;place-items:center;background:var(--panel3);border:2px solid var(--line);color:var(--fg);cursor:pointer;padding:0}
.hb:active{background:#2d3a68}
.hc{position:relative;flex:1 1 0;min-width:0;display:flex;align-items:center;gap:5px;padding:4px 6px 7px;background:var(--panel2);border:2px solid var(--line);overflow:hidden}
.hc.money{flex:1.35 1 0}
.hc svg{width:11px;height:11px;margin-right:3px;vertical-align:-1px}
.hc>div{min-width:0}
.hc small{display:block;font-size:10px;line-height:1.1;color:var(--dim);white-space:nowrap}
.hc b{display:block;font-size:16px;line-height:1.15;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.hc em{font-style:normal;font-size:10px;color:var(--good);margin-left:5px}
.hc .bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.45)}
.hc .bar u{display:block;height:100%;width:0;background:var(--good);text-decoration:none;transition:width .3s}
.hc.en .bar u{background:#ffd04a}
.hc.land .bar u{background:var(--blue)}
.c-money{color:var(--gold)}.c-en{color:#ffd04a}.c-sol{color:#9fd0ff}.c-land{color:#7fe08a}
/* ---------- карта ---------- */
#wrap{position:relative;flex:1;min-height:0;background:#0b2a52;overflow:hidden}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none;display:block}
#mm{position:absolute;left:8px;top:8px;width:128px;height:83px;border:2px solid var(--line);background:#0b2a52;image-rendering:pixelated;touch-action:none;z-index:3;box-shadow:2px 2px 0 rgba(0,0,0,.5)}
#ctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:3}
.cb,#zoom button{width:46px;height:46px;display:grid;place-items:center;background:rgba(19,27,48,.92);color:var(--fg);border:2px solid var(--line);cursor:pointer;padding:0;position:relative;box-shadow:2px 2px 0 rgba(0,0,0,.5)}
.cb:active,#zoom button:active{background:#2d3a68}
.cb.on{border-color:var(--gold);color:var(--gold)}
.cb b{position:absolute;right:2px;bottom:0;font-size:11px;font-weight:700}
.cap #mm,.cap #ctl,.cap #zoom{display:none}
#rank{position:absolute;left:8px;top:98px;max-height:60%;overflow:auto;width:190px;max-width:62%;background:rgba(19,27,48,.95);border:2px solid var(--line);padding:6px;font-size:13px;z-index:3}
#rank div{display:flex;gap:6px;align-items:center;padding:2px 0}
#rank i{flex:0 0 12px;height:12px;display:block;border:1px solid rgba(0,0,0,.5)}
#rank span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rank b{font-variant-numeric:tabular-nums}
#rank .dead{opacity:.45;text-decoration:line-through}
#count{position:absolute;top:8px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;width:min(92%,360px);z-index:4}
#count b{display:block;font-family:var(--f2);font-size:34px;color:#fff;text-shadow:3px 3px 0 #000;font-variant-numeric:tabular-nums}
#count span{display:block;margin-top:6px;font-size:14px;background:rgba(10,14,28,.85);padding:4px 8px;border:2px solid var(--line)}
#bt{height:8px;background:rgba(0,0,0,.55);margin-top:6px;border:2px solid #000}
#bt i{display:block;height:100%;width:100%;background:var(--gold)}
#goal{position:absolute;top:8px;left:144px;right:64px;padding:5px 8px;background:rgba(19,27,48,.93);border:2px solid var(--gold);font-size:13px;line-height:1.25;z-index:3;pointer-events:none;color:#ffe9a8;text-align:center}
#alarm{position:absolute;top:100px;left:50%;transform:translateX(-50%);max-width:92%;padding:8px 14px;background:#b91c1c;border:3px solid #fff;font:700 15px var(--f1);text-align:center;z-index:5;pointer-events:none;box-shadow:4px 4px 0 #000;width:max-content}
#info{position:absolute;left:8px;right:64px;bottom:8px;padding:8px 10px;background:var(--panel);border:2px solid var(--gold);display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:4;font-size:14px}
#info span{flex:1 1 140px}
#info button{min-height:44px;padding:0 14px;background:var(--panel3);color:var(--fg);border:2px solid var(--line);font:600 15px var(--f1);cursor:pointer}
#info button#infR{background:var(--gold);color:#1a1405;border-color:var(--gold2)}
#hint{position:absolute;left:8px;right:64px;bottom:8px;font-size:14px;line-height:1.3;color:#fff;background:rgba(10,14,28,.72);padding:4px 8px;pointer-events:none;z-index:2}
#hint:empty{display:none}
#info:not([hidden])~#hint{display:none}
#zoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;z-index:3}
#zoom button{font-size:26px;font-weight:700}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);max-width:88%;width:max-content;padding:8px 12px;background:var(--panel);border:2px solid var(--gold);font-size:14px;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
#toast.on{opacity:1}
#chatBox{position:absolute;left:8px;bottom:8px;width:min(330px,calc(100% - 70px));max-height:48%;display:flex;flex-direction:column;background:rgba(19,27,48,.97);border:2px solid var(--line);z-index:7;box-shadow:4px 4px 0 #000;-webkit-user-select:text;user-select:text}
#chatLog{flex:1;overflow-y:auto;padding:6px;font-size:13px;line-height:1.35;min-height:70px}
#chatLog div{margin:2px 0;word-break:break-word}
#chatLog b{color:var(--gold)}
#chatRow{display:flex;gap:4px;padding:6px;border-top:2px solid var(--line)}
#chatInput{flex:1;min-width:0;padding:8px;background:var(--panel2);color:var(--fg);border:2px solid var(--line);font:600 15px var(--f1);min-height:44px;-webkit-user-select:text;user-select:text}
#chatSend{min-width:48px;min-height:44px;background:var(--gold);color:#1a1405;border:0;font:700 16px var(--f1);cursor:pointer}
/* ---------- панель построек ---------- */
#bar{display:flex;gap:6px;padding:7px 8px;overflow-x:auto;overflow-y:hidden;background:linear-gradient(#121a30,#0e1527);border-top:2px solid var(--line);touch-action:pan-x;-webkit-overflow-scrolling:touch;flex:none;align-items:stretch;padding-bottom:max(7px,env(safe-area-inset-bottom))}
.tb{flex:0 0 auto;min-width:80px;padding:5px 6px 4px;background:var(--panel2);color:var(--fg);border:2px solid var(--line);font:inherit;text-align:center;cursor:pointer;touch-action:manipulation;display:flex;flex-direction:column;align-items:center;gap:1px}
.tb canvas{display:block;width:44px;height:44px;image-rendering:pixelated;pointer-events:none}
.tb b{display:block;font-size:13px;font-weight:600;pointer-events:none;white-space:nowrap}
.tb i{display:block;font-style:normal;font-size:12px;color:var(--gold);pointer-events:none;white-space:nowrap}
.tb.on{border-color:var(--gold);background:#2d3560;box-shadow:inset 0 0 0 2px rgba(246,199,68,.35)}
.tb.poor i{color:var(--bad)}
.tb:active{background:#2d3a68}
.sep{flex:0 0 2px;background:var(--line);align-self:stretch}
#goal button{pointer-events:auto;margin-left:8px;min-height:32px;padding:0 10px;background:var(--panel3);border:2px solid var(--line);font:600 13px var(--f1);cursor:pointer}
#goal.tut{pointer-events:auto;text-align:left;left:8px;right:64px;top:98px;z-index:7;border-color:#6fb7f0;color:#dfeaff}
#offer{position:absolute;left:8px;right:64px;top:100px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px;background:rgba(19,27,48,.97);border:2px solid #6fb7f0;z-index:8;font-size:14px;box-shadow:3px 3px 0 #000}
#offer span{flex:1 1 130px}
#offer button{min-height:44px;padding:0 12px;border:2px solid var(--line);background:var(--panel3);color:var(--fg);font:600 14px var(--f1);cursor:pointer}
#offer #offY{background:var(--gold);color:#1a1405;border-color:var(--gold2)}
#dipBox{position:absolute;inset:6px;background:rgba(14,20,38,.98);border:2px solid var(--gold);z-index:9;overflow-y:auto;padding:10px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#dipBox .dh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#dipBox h3{margin:0;font:400 13px var(--f2);color:var(--gold)}
#dipBox .dh span{font-size:13px;color:var(--good)}
.dr{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;margin-top:6px;background:var(--panel2);border:2px solid var(--line)}
.dr.al{border-color:#3b8f5a}
.dl{flex:1 1 150px;display:flex;gap:8px;align-items:center;min-width:0}
.dl i{flex:none;width:16px;height:16px;border:2px solid rgba(0,0,0,.6)}
.dl b{display:block;font-size:14px}
.dl span{display:block;font-size:12px;color:var(--dim)}
.db{display:flex;gap:6px}
.db button,.aid button{min-height:44px;padding:0 10px;background:var(--panel3);color:var(--fg);border:2px solid var(--line);font:600 14px var(--f1);cursor:pointer}
.db button.gold{background:var(--gold);color:#1a1405;border-color:var(--gold2)}
.db button.warn{border-color:#8f3b3b;color:#ffb3b3}
.aid{flex:1 1 100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:6px}
.aid button{display:flex;flex-direction:column;align-items:center;padding:6px 4px}
.aid span{font-size:11px;color:var(--gold)}
@keyframes hl{50%{box-shadow:0 0 0 4px rgba(246,199,68,.7);border-color:#fff}}
.tb.hl{animation:hl 1s infinite;border-color:var(--gold)}
body:has(#scr:not([hidden])) #hud,body:has(#scr:not([hidden])) #bar{visibility:hidden}
button:focus-visible{outline:2px solid #fff;outline-offset:1px}
/* ---------- окна ---------- */
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,8,18,.8);z-index:20;touch-action:pan-y}
.card{width:min(100%,430px);max-height:100%;overflow:auto;background:var(--panel);border:3px solid var(--line);padding:18px;box-shadow:6px 6px 0 #000;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.card h1{margin:0 0 12px;font:400 16px/1.5 var(--f2);color:var(--gold);text-wrap:balance}
.card p{margin:0 0 10px;font-size:15px;line-height:1.45;color:#cdd6ee}
.big{display:block;width:100%;margin-top:10px;padding:14px;min-height:52px;font:700 18px var(--f1);background:var(--gold);color:#1a1405;border:0;box-shadow:0 4px 0 var(--gold2);cursor:pointer}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 var(--gold2)}
.big.blue{background:var(--blue);color:#fff;box-shadow:0 4px 0 #0b2a5c}
.sec{display:block;width:100%;margin-top:8px;padding:12px;min-height:48px;font:600 16px var(--f1);background:var(--panel3);color:var(--fg);border:2px solid var(--line);cursor:pointer}
.sec:active{background:#2d3a68}
.st .sec{width:auto;margin:0;padding:8px 12px;min-height:44px}
#ovB2{margin-top:8px}
#load{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(5,8,18,.88);font:400 14px var(--f2);color:var(--gold);text-align:center;padding:20px;line-height:1.7}
/* ---------- полноэкранные страницы ---------- */
#scr{position:fixed;inset:0;z-index:15;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;background:linear-gradient(rgba(6,10,22,.7),rgba(6,10,22,.93))}
.pg{max-width:460px;margin:0 auto;padding:12px 14px 30px;padding-top:max(12px,env(safe-area-inset-top))}
.sh{display:flex;align-items:center;gap:8px;min-height:48px;margin-bottom:10px}
.sh h2{flex:1;margin:0;font:400 14px/1.4 var(--f2);color:var(--gold);text-align:center;text-wrap:balance}
.shl{flex:0 0 92px}
.bk{display:flex;align-items:center;gap:4px;min-height:44px;padding:0 12px 0 8px;background:var(--panel3);border:2px solid var(--line);font:600 15px var(--f1);cursor:pointer}
.bk:active{background:#2d3a68}
.coin{flex:0 0 92px;display:flex;align-items:center;justify-content:flex-end;gap:6px;color:var(--gold);font:700 17px var(--f1)}
.coin i,i.cn{display:inline-block;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#f6c744 55%,#b98a10);border:2px solid #7a5a08;position:relative;flex:none}
.coin i::after,i.cn::after{content:'';position:absolute;left:5px;top:3px;width:4px;height:8px;background:#b98a10}
.sb{display:block}
.blk{background:rgba(19,27,48,.9);border:2px solid var(--line);padding:12px;margin-bottom:10px}
.blk h3,h3.br{margin:0 0 8px;font:700 14px var(--f1);color:var(--gold);text-transform:uppercase;letter-spacing:.06em}
h3.br{margin:14px 0 6px}
.blk p,.sm{margin:0 0 8px;font-size:14px;line-height:1.4;color:#b9c4e4}
.story{font-size:15px;line-height:1.5;color:#dfe6fa}
.ft{text-align:center;font-size:12px;color:var(--dim);margin:14px 0 0}
#pv{display:block;width:100%;height:auto;aspect-ratio:480/312;image-rendering:pixelated;border:2px solid var(--line);touch-action:manipulation;cursor:pointer;background:#0b2a52}
.sws{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sw{aspect-ratio:1;min-height:44px;border:3px solid rgba(0,0,0,.6);cursor:pointer;padding:0}
.sw.on{border-color:#fff;box-shadow:0 0 0 3px var(--gold)}
.sks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sk{position:relative;display:flex;flex-direction:column;gap:5px;padding:6px;background:var(--panel2);border:2px solid var(--line);cursor:pointer;font:inherit;color:inherit;text-align:center}
.sk canvas{width:100%;height:auto;aspect-ratio:64/36;image-rendering:pixelated;pointer-events:none}
.sk.big2 canvas{aspect-ratio:120/64}
.sk span{font-size:13px;pointer-events:none}
.sk.on{border-color:var(--gold);background:#2d3560}
.sk.lock{opacity:.7}
.sk .buy{margin-top:2px}
.seg2{display:flex;gap:6px;flex-wrap:wrap}
.seg2 button{flex:1 1 0;min-width:70px;min-height:46px;padding:8px 6px;background:var(--panel2);border:2px solid var(--line);font:600 15px var(--f1);cursor:pointer}
.seg2.five button{min-width:0;padding:8px 2px}
.seg2 button.on{border-color:var(--gold);background:#2d3560;color:var(--gold)}
.st{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.st>span{font-size:15px}
.st:last-of-type{border:0}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;min-height:46px;padding:6px 4px;background:var(--panel2);border:2px solid var(--line);font:600 15px var(--f1);cursor:pointer}
.tabs button.on{border-color:var(--gold);background:#2d3560;color:var(--gold)}
.it{display:flex;gap:10px;align-items:center;padding:10px;margin-bottom:8px;background:rgba(19,27,48,.92);border:2px solid var(--line)}
.it>div{flex:1;min-width:0}
.it b{display:block;font-size:16px}
.it span{display:block;font-size:13px;color:var(--dim);margin-top:2px;line-height:1.3}
.it.ok{border-color:#2f7a4a}
.it s{display:flex;gap:4px;margin-top:6px;text-decoration:none}
.it s i{width:14px;height:8px;background:#2a3658}
.it s i.on{background:var(--gold)}
.pb{height:8px;margin-top:6px;background:#0a0f1e;border:1px solid var(--line)}
.pb i{display:block;height:100%;background:var(--good)}
.buy{flex:none;min-width:96px;min-height:46px;padding:6px 10px;background:var(--gold);color:#1a1405;border:0;font:700 14px var(--f1);box-shadow:0 3px 0 var(--gold2);cursor:pointer}
.buy:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--gold2)}
.buy:disabled{background:#3a4468;color:#8e98b8;box-shadow:none;cursor:default}
em.rw{flex:none;font-style:normal;font-weight:700;color:var(--gold);min-width:64px;text-align:right}
.it.ok em.rw{color:var(--good)}
.lvs{display:grid;gap:8px}
.lv{display:grid;grid-template-columns:44px 1fr auto;gap:2px 10px;align-items:center;text-align:left;padding:10px;background:rgba(19,27,48,.92);border:2px solid var(--line);cursor:pointer;min-height:64px}
.lv em{grid-row:1/3;font:400 16px var(--f2);font-style:normal;color:var(--gold);text-align:center}
.lv b{font-size:16px}
.lv span{grid-column:2;font-size:12px;color:var(--dim);line-height:1.3}
.lv s{grid-row:1/3;grid-column:3;display:flex;gap:3px;text-decoration:none}
.lv s i,.stars i{width:16px;height:16px;background:#2a3658;clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%)}
.lv s i.on,.stars i.on{background:var(--gold)}
.lv.lock{opacity:.5}
.stars{display:flex;gap:8px;justify-content:center;margin:6px 0 10px}
.stars i{width:34px;height:34px}
.rew{background:var(--panel2);border:2px solid var(--line);padding:8px 10px;margin:8px 0;font-size:14px}
.rew div{padding:2px 0}
.rew .tot{color:var(--gold);font-weight:700;border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
/* ---------- вход ---------- */
.auth{max-width:420px;margin:0 auto}
.fld{display:block;margin:0 0 10px}
.fld span{display:block;font-size:13px;color:var(--dim);margin-bottom:4px}
.fld input{width:100%;min-height:50px;padding:10px 12px;background:#0d1426;color:var(--fg);border:2px solid var(--line);font:600 17px var(--f1);-webkit-user-select:text;user-select:text;border-radius:0}
.fld input:focus{outline:none;border-color:var(--gold)}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;color:#cdd6ee;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--gold)}
.err{min-height:20px;margin:4px 0 0;color:var(--bad);font-size:14px}
/* ---------- главное меню ---------- */
.home{max-width:430px;margin:0 auto}
.me{display:flex;align-items:center;gap:10px;padding:8px 10px;background:rgba(19,27,48,.92);border:2px solid var(--line)}
.av{flex:none;width:44px;height:44px;display:grid;place-items:center;font:400 18px var(--f2);color:#111;border:3px solid rgba(0,0,0,.55)}
.me .nm{flex:1;min-width:0}
.me b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me span{font-size:12px;color:var(--dim)}
.me .coin{flex:none}
.logo{text-align:center;padding:22px 0 14px}
.logo h1{margin:0;font:400 22px/1.45 var(--f2);color:var(--gold);text-shadow:3px 3px 0 #000,0 0 18px rgba(246,199,68,.35)}
.logo p{margin:10px 0 0;font-size:14px;color:#b9c4e4}
.flagbar{display:flex;justify-content:center;gap:4px;margin-top:12px}
.flagbar i{width:22px;height:8px}
.play{display:flex;align-items:center;gap:14px;width:100%;min-height:76px;padding:10px 16px;text-align:left;background:linear-gradient(#ffd75e,#f0b92a);color:#1a1405;border:0;box-shadow:0 5px 0 var(--gold2),0 0 0 3px #000;cursor:pointer;margin:4px 0 14px}

let roomApi=null,mpFx=[],mpBm=[],evT=60,mpNotice='';
let roomWhy='проверяем…';
async function getRoom(){
 if(roomApi)return roomApi;
 try{
  if(!window.claude||!window.claude.use){roomWhy='страница открыта вне Claude (нет среды артефакта)';return null;}
  roomApi=await window.claude.use('room');
  roomWhy=roomApi?'доступен':'не выдан доступ к комнатам для этого пользователя. Откройте игру по ссылке из Claude под своим аккаунтом, владелец должен дать доступ «Участник» или выше';
 }catch(e){roomApi=null;roomWhy='ошибка: '+((e&&(e.code||e.message))||e);}
 return roomApi;
}
function mpStatus(){const el=$('mpInfo');if(el)el.textContent='Онлайн: '+roomWhy;}
getRoom().then(mpStatus);
function say(m,all){toast(m);if(all!==false&&MP.on&&MP.host)emitTo('msg',{to:'*',m});}
function emitTo(topic,data){if(!MP.room)return;try{const r=MP.room.emit(topic,data);if(r&&r.catch)r.catch(()=>{});}catch(e){}}
function doAct(kind,a){
 const me=ME;
 if(MP.on&&!MP.host){
  let e='';
  if(kind=='place')e=canPlace(me,a.t,a.x,a.y);
  else if(kind=='repair'){const b=a.b;if(!b||b.o!=me)e='Это не ваше здание';else if(b.hp>=b.max)e='Здание целое';else if(P[me].money<Math.ceil((b.max-b.hp)*.5))e='Не хватает денег';}
  else if(kind=='missile')e=!P[me].cnt.silo?'Нужна ракетная шахта':!nearestB(me,'silo',a.tx,a.ty,MR)?'Цель дальше '+MR+' км от ваших шахт':P[me].money<MCOST?'Не хватает денег':'';
  else if(kind=='drone')e=!P[me].cnt.dfac?'Нужен завод дронов':!nearestB(me,'dfac',a.tx,a.ty,DR)?'Цель дальше '+DR+' км от ваших заводов':P[me].money<DCOST?'Не хватает денег':'';
  else if(kind=='assault')e=assaultInfo(me,a.x,a.y).err;
  else if(kind=='tank')e=!P[me].cnt.factory?'Нужен завод техники':P[me].money<UN.tank.c?'Не хватает денег':'';
  else if(kind=='rpg')e=!P[me].cnt.barracks?'Нужна казарма':P[me].money<UN.rpg.c?'Не хватает денег':P[me].sol<UN.rpg.sol?'Мало солдат: нужно '+UN.rpg.sol:'';
  else if(kind=='plane')e=!P[me].cnt.airfield?'Нужен аэродром':P[me].money<UN.plane.c?'Не хватает денег':'';
  else if(kind=='howitzer')e=!P[me].cnt.factory?'Нужен завод техники':P[me].money<UN.howitzer.c?'Не хватает денег':P[me].sol<UN.howitzer.sol?'Мало солдат: нужно '+UN.howitzer.sol:'';
  else if(kind=='nuke')e=!P[me].cnt.silo?'Нужна ракетная шахта':!nearestB(me,'silo',a.tx,a.ty,NR)?'Цель дальше '+NR+' км от ваших шахт':P[me].money<NCOST?'Нужно '+NCOST+' монет':'';
  if(e)return e;
  emitTo('cmd',{c:kind,t:a.t,x:a.x,y:a.y,tx:a.tx,ty:a.ty});
  if(kind=='place'){snd(300,.12,'square',.05,500);P[me].money-=BT[a.t].c;}
  return '';
 }
 if(kind=='place')return place(me,a.t,a.x,a.y);
 if(kind=='missile')return launchMissile(me,a.tx,a.ty);
 if(kind=='drone')return launchDrones(me,a.tx,a.ty);
 if(kind=='assault')return assault(me,a.x,a.y);
 if(kind=='repair')return repair(a.b);
 if(kind=='tank')return orderGround(me,'tank',a.x,a.y,'factory');
 if(kind=='rpg')return orderGround(me,'rpg',a.x,a.y,'barracks');
 if(kind=='plane')return orderPlane(me,a.tx,a.ty);
 if(kind=='howitzer')return orderGround(me,'howitzer',a.x,a.y,'factory');
 if(kind=='nuke')return launchNuke(me,a.tx,a.ty);
 return '';
}
function paintMe(x,y,r){paintAt(ME,x,y,r);if(MP.on&&!MP.host&&MP.paintBuf.length<80)MP.paintBuf.push([+x.toFixed(1),+y.toFixed(1)]);}
/* ----- события мира ----- */
function evTick(dt){
 evT-=dt;if(evT>0)return;evT=70+rng()*50;
 const alive=[];for(let k=1;k<=NN;k++)if(P[k].alive)alive.push(k);
 if(rng()<.5){
  const land=[];for(let n=0;n<400&&land.length<1;n++){const x=(rng()*W)|0,y=(rng()*H)|0;if(T[y*W+x]>=2)land.push({x,y});}
  if(!land.length)return;const c=land[0];say('Метеоритный дождь: удар у координат '+c.x+':'+c.y);
  for(let i=0;i<7;i++){const x=c.x+(rng()-.5)*14,y=c.y+(rng()-.5)*14;if(x>0&&y>0&&x<W&&y<H)boom(x,y,1.8,70);}
 }else{
  const k=alive[(rng()*alive.length)|0];P[k].money+=300;say('Нефтяной бум: '+nameOf(k)+' получает 300');
 }
}
/* ----- хост: рассылка состояния ----- */
function encRows(y0,y1){
 const out=[];
 for(let y=y0;y<y1;y++){let s='',v=OWN[y*W],c=0;for(let x=0;x<W;x++){const o=OWN[y*W+x];if(o==v)c++;else{s+=v+':'+c+',';v=o;c=1;}}s+=v+':'+c;out.push(s);}
 return out;
}
function sendOwn(y0,y1){
 let a=y0;
 while(a<y1){
  let b=a,rows=[],size=0;
  while(b<y1){const r=encRows(b,b+1)[0];if(size+r.length>3000&&rows.length)break;rows.push(r);size+=r.length+3;b++;}
  emitTo('ow',{y:a,r:rows});a=b;
 }
}
function sendBld(){
 MP.blV++;const all=B.filter(b=>!b.dead).map(b=>[BKEYS.indexOf(b.t),b.o,b.x,b.y,Math.round(b.hp),b.cap?1:0]);
 const per=80,n=Math.max(1,Math.ceil(all.length/per));
 for(let i=0;i<n;i++)emitTo('bl',{v:MP.blV,i,n,d:all.slice(i*per,(i+1)*per)});
}
function mpHostTick(dt){
 MP.snapT-=dt;if(MP.snapT>0)return;MP.snapT=.3;
 emitTo('ph',{p:phase,c:+capT.toFixed(1),g:Math.floor(gameT),d:diff});
 emitTo('pl',P.slice(1).map(p=>[Math.floor(p.money),Math.floor(p.sol),p.alive?1:0,p.sup,p.dem,Math.round(p.inc*10),p.tiles,p.human?1:0]));
 const rows=Math.ceil(H/8);const y0=(MP.band%8)*rows;MP.band++;sendOwn(y0,Math.min(H,y0+rows));
 const pr=PR.filter(p=>!p.dead&&p.k!='s').slice(0,45).map(p=>[p.k=='m'?0:p.k=='n'?2:1,p.o,+p.sx.toFixed(1),+p.sy.toFixed(1),+p.tx.toFixed(1),+p.ty.toFixed(1),+p.t.toFixed(2),+p.dur.toFixed(2),p.hp||1]);
 emitTo('pr',pr);
 emitTo('un',U.filter(u=>!u.dead).slice(0,70).map(u=>[u.id,u.k=='tank'?0:u.k=='rpg'?1:u.k=='howitzer'?3:2,u.o,+u.x.toFixed(2),+u.y.toFixed(2),Math.round(u.hp),+(u.a||0).toFixed(2),+(u.ta||0).toFixed(2),Math.round(u.max)]));
 if(mpFx.length||mpBm.length){emitTo('fx',{a:mpFx.slice(0,30),b:mpBm.slice(0,30)});mpFx=[];mpBm=[];}
 MP.blT-=.3;if(MP.blT<=0){MP.blT=1.2;sendBld();}
}
/* ----- клиент: применение снимков ----- */
function applySnap(topic,d){
 MP.lastSnap=performance.now();MP.lostShown=false;
 if(topic=='ph'){
  capT=d.c;gameT=d.g;
  if(d.p=='play'&&phase=='cap')endCapture();
  else if(d.p=='end'){}
 }else if(topic=='pl'){
  d.forEach((a,i)=>{const p=P[i+1];if(!p)return;p.money=a[0];p.sol=a[1];p.alive=!!a[2];p.sup=a[3];p.dem=a[4];p.inc=a[5]/10;p.tiles=a[6];p.human=!!a[7];p.eff=p.dem<=p.sup?1:p.sup/p.dem;});
  if(phase=='play')checkEnd();
 }else if(topic=='ow'){
  d.r.forEach((row,j)=>{const y=d.y+j;if(y>=H)return;let x=0;for(const seg of row.split(',')){const q=seg.split(':'),v=+q[0],c=+q[1];for(let i=0;i<c&&x<W;i++)OWN[y*W+x++]=v;}});
  ownDirty=tilesDirty=true;
 }else if(topic=='bl'){
  if(!MP.blBuf||MP.blBuf.v!=d.v)MP.blBuf={v:d.v,n:d.n,got:{},};
  MP.blBuf.got[d.i]=d.d;
  if(Object.keys(MP.blBuf.got).length>=MP.blBuf.n){
   const nb=[];for(let i=0;i<MP.blBuf.n;i++)for(const a of MP.blBuf.got[i]||[]){const t=BKEYS[a[0]];if(!t&&a[5]!=1)continue;const cap=!!a[5];const m=cap?300:BT[t].hp;nb.push({t:t||'city',o:a[1],x:a[2],y:a[3],hp:a[4],max:m,cap,cd:0,dead:false});}
   B=nb;BLD.fill(-1);B.forEach((b,i)=>{BLD[b.y*W+b.x]=i;});MP.blBuf=null;
   for(let k=1;k<=NN;k++)P[k].cnt={};for(const b of B){const c=P[b.o].cnt;c[b.t]=(c[b.t]||0)+1;}
   if(selB){selB=B[BLD[selB.y*W+selB.x]]||null;if(!selB)closeInfo();}
  }
 }else if(topic=='pr'){
  PR=d.map(a=>({k:['m','d','n'][a[0]]||'m',o:a[1],sx:a[2],sy:a[3],tx:a[4],ty:a[5],t:a[6],dur:a[7],hp:a[8],x:a[2],y:a[3],w:0,dead:false}));
 }else if(topic=='un'){
  const seen=new Set(),KN=['tank','rpg','plane','howitzer'];
  for(const a of d){seen.add(a[0]);let u=U.find(q=>q.id==a[0]);if(!u){u={id:a[0],k:KN[a[1]],o:a[2],x:a[3],y:a[4],hp:a[5],max:a[8],a:a[6],ta:a[7],dead:false};U.push(u);}u.sx=a[3];u.sy=a[4];u.hp=a[5];u.max=a[8];u.sa=a[6];u.sta=a[7];u.o=a[2];}
  U=U.filter(u=>seen.has(u.id));
 }else if(topic=='fx'){
  for(const a of d.a||[]){if(a[2]>=90)nukeFx(a[0],a[1]);else boom(a[0],a[1],a[2],0);}
  for(const a of d.b||[])BM.push({x1:a[0],y1:a[1],x2:a[2],y2:a[3],life:.18,c:'#9ff'});
 }
}
function updateClient(dt){
 if(phase=='cap')capT=Math.max(0,capT-dt);
 for(const p of PR){p.t+=dt/p.dur;const t=Math.min(1,Math.max(0,p.t));p.x=p.sx+(p.tx-p.sx)*t;p.y=p.sy+(p.ty-p.sy)*t;if(p.k=='d'){p.x+=Math.sin(performance.now()/160+p.sx)*.15;}}
 for(const u of U){if(u.sx===undefined)continue;const k=Math.min(1,dt*7);u.x+=(u.sx-u.x)*k;u.y+=(u.sy-u.y)*k;let da=u.sa-u.a;while(da>Math.PI)da-=6.283;while(da<-Math.PI)da+=6.283;u.a+=da*k;u.ta=u.sta;}
 let inc=null;for(const p of PR){if(p.o!=ME&&p.t>.05&&p.t<1){const tx=Math.floor(p.tx),ty=Math.floor(p.ty);if(tx>=0&&ty>=0&&tx<W&&ty<H&&OWN[ty*W+tx]==ME)inc=p.k;}}
 if(inc){alarmT=1.2;alarmK=inc;}else alarmT-=dt;
 for(const r of EF)r.life-=dt;EF=EF.filter(r=>r.life>0);
 for(const p of PT){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;}PT=PT.filter(p=>p.life>0);
 for(const b of BM)b.life-=dt;BM=BM.filter(b=>b.life>0);
 shake*=Math.pow(.02,dt);
 if(phase=='play'&&MP.lastSnap&&performance.now()-MP.lastSnap>9000&&!MP.lostShown){MP.lostShown=true;mpNotice='Связь с хостом потеряна';phase='end';showEnd(false);}
}
function mpTick(dt){
 if(!MP.on)return;
 if(MP.host){if(phase=='cap'||phase=='play')mpHostTick(dt);}
 else if(phase=='cap'){
  MP.paintT-=dt;if(MP.paintT<=0&&MP.paintBuf.length){MP.paintT=.12;emitTo('cmd',{c:'paint',p:MP.paintBuf});MP.paintBuf=[];}
 }
}
/* ----- хост: команды ----- */
function onCmd(msg){
 if(!MP.host||!MP.on)return;const d=msg.data||{};const s=MP.slots[msg.peer];if(!s||!P[s]||!P[s].alive)return;
 let e='';
 if(d.c=='paint'){if(phase=='cap'&&Array.isArray(d.p))for(const q of d.p.slice(0,80)){if(Array.isArray(q)&&isFinite(q[0])&&isFinite(q[1]))paintAt(s,+q[0],+q[1],1.6);}return;}
 if(phase!='play')return;
 const n=v=>Math.floor(+v),f=v=>+v;
 if(d.c=='place'&&BT[d.t]&&isFinite(d.x)&&isFinite(d.y))e=place(s,d.t,n(d.x),n(d.y));
 else if(d.c=='missile'&&isFinite(d.tx)&&isFinite(d.ty))e=launchMissile(s,f(d.tx),f(d.ty));
 else if(d.c=='drone'&&isFinite(d.tx)&&isFinite(d.ty))e=launchDrones(s,f(d.tx),f(d.ty));
 else if(d.c=='assault'&&isFinite(d.x)&&isFinite(d.y))e=assault(s,n(d.x),n(d.y));
 else if(d.c=='tank'&&isFinite(d.x)&&isFinite(d.y))e=orderGround(s,'tank',n(d.x),n(d.y),'factory');
 else if(d.c=='rpg'&&isFinite(d.x)&&isFinite(d.y))e=orderGround(s,'rpg',n(d.x),n(d.y),'barracks');
 else if(d.c=='plane'&&isFinite(d.tx)&&isFinite(d.ty))e=orderPlane(s,f(d.tx),f(d.ty));
 else if(d.c=='howitzer'&&isFinite(d.x)&&isFinite(d.y))e=orderGround(s,'howitzer',n(d.x),n(d.y),'factory');
 else if(d.c=='nuke'&&isFinite(d.tx)&&isFinite(d.ty))e=launchNuke(s,f(d.tx),f(d.ty));
 else if(d.c=='repair'&&isFinite(d.x)&&isFinite(d.y)){const bi=BLD[n(d.y)*W+n(d.x)];const b=bi>=0?B[bi]:null;
  if(!b||b.o!=s)e='Это не ваше здание';else if(b.hp>=b.max)e='Здание целое';else{const c=Math.ceil((b.max-b.hp)*.5);if(P[s].money<c)e='Не хватает денег: '+c;else{P[s].money-=c;b.hp=b.max;}}}
 if(e)emitTo('msg',{to:msg.peer,m:e});
}
/* ----- лобби ----- */
function peerCount(){try{return MP.room?MP.room.peers().filter(p=>p.kind=='viewer').length:0;}catch(e){return 0;}}
function lobbyView(){
 const st=$('mpSt');if(!st)return;
 const cnt=Object.keys(MP.slots).length;
 st.textContent=MP.host?('Комната '+MP.code+'. Игроков: '+cnt+' из '+NN+'. Остальные страны ведёт ИИ.'):(cnt?'Вы в комнате '+MP.code+'. Ждём, когда хост начнёт игру.':'Подключаемся к комнате '+MP.code+'…');
}
async function mpOpen(code,host){
 if(!(await getRoom())){toast('Мультиплеер недоступен: '+roomWhy);mpStatus();return;}
 code=(code||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,12);if(code.length<3){toast('Код комнаты: от 3 символов, латиница и цифры');return;}
 try{MP.room=await roomApi.join('pf-'+code);}catch(e){MP.room=null;toast('Не удалось войти в комнату ('+((e&&e.code)||'ошибка')+'). Нужен доступ «Участник» или выше.');return;}
 MP.code=code;MP.host=host;MP.slots={};MP.started=false;MP.on=false;
 const r=MP.room;
 if(host)MP.slots={};
 const mark=m=>{if(m.isMe&&m.sameTab)MP.myPeer=m.peer;};
 r.on('join',m=>{mark(m);if(!MP.host||MP.started)return;if(!MP.slots[m.peer]){const used=Object.values(MP.slots);for(let k=2;k<=NN;k++)if(!used.includes(k)){MP.slots[m.peer]=k;break;}}
  MP.prefs=MP.prefs||{};const dd=m.data||{};MP.prefs[m.peer]={col:String(dd.col||''),sk:String(dd.sk||'solid')};emitTo('lobby',{s:MP.slots,h:MP.myPeer});lobbyView();});
 r.on('lobby',m=>{mark(m);if(MP.host)return;MP.slots=m.data.s||{};lobbyView();});
 r.on('start',m=>{mark(m);if(MP.host)return;mpClientStart(m.data);});
 r.on('cmd',onCmd);
 r.on('chat',m=>{if(m.isMe)return;const d=m.data||{};chatAdd(String(d.n||'Игрок').slice(0,16),String(d.t||'').slice(0,120),true);});
 for(const t of ['ph','pl','ow','bl','pr','un','fx'])r.on(t,m=>{if(MP.host||!MP.on)return;applySnap(t,m.data);});
 r.on('msg',m=>{const d=m.data||{};if(d.to=='*'&&!MP.host)toast(d.m);else if(d.to===MP.myPeer)toast(d.m);});
 r.onPeers(ch=>{
  if(MP.host&&MP.started){for(const l of ch.left){const s=MP.slots[l.peer];if(s&&P[s]){P[s].human=false;P[s].aiT=3;say(NAMES[s]+' отключился, страной управляет ИИ');delete MP.slots[l.peer];}}}
  lobbyView();
 });
 if(host){MP.myPeer=null;MP.slots={};}
 showLobby();
 if(!host){const ping=()=>{if(MP.started||!MP.room||MP.on)return;emitTo('join',{col:PF.color,sk:PF.skin});setTimeout(ping,1500);};ping();}
}
function showLobby(){
 $('ovT').textContent='МУЛЬТИПЛЕЕР';
 $('ovP').innerHTML='<p id="mpSt"></p><p style="font-size:13px;color:var(--dim)">Игроки заходят по одному коду. Хост считает игру. Играть могут люди с доступом участника или редактора.</p>';
 lobbyView();
 if(MP.host){$('ovB').textContent='Начать игру';$('ovB').onclick=mpHostStart;}
 else{$('ovB').textContent='Назад';$('ovB').onclick=()=>{mpLeave();showHome();};}
 $('ov').hidden=false;
}
function mpHostStart(){
 if(MP.started)return;MP.started=true;MP.on=true;ME=1;
 const slots=Object.assign({},MP.slots),humans=[1].concat(Object.values(slots));
 const cols=[],skins=[],used=new Set();
 cols[1]=PF.color;skins[1]=PF.skin;used.add(PF.color);
 for(const peer in slots){const k=slots[peer],pr=(MP.prefs&&MP.prefs[peer])||{};let c=pr.col;if(!PAL.some(x=>x.id==c)||used.has(c))c=null;if(c){cols[k]=c;used.add(c);}skins[k]=PAL&&pr.sk&&SKINS.some(x=>x.id==pr.sk)?pr.sk:'solid';}
 const seedv=(Math.random()*1e9)|0;
 newGame({seed:seedv,slot:1,colorId:PF.color,skin:PF.skin,cols:Object.assign([],cols),skins:Object.assign([],skins),humans});
 for(const k of humans)P[k].human=true;
 const outCols=[],outSk=[];for(let k=1;k<=NN;k++){outCols[k]=P[k].col;outSk[k]=P[k].skin;}
 for(const k of humans)P[k].money=400;
 emitTo('start',{seed:seedv,diff,s:slots,cols:outCols,sk:outSk});
 MP.slots=slots;startCaptureNoReset();
}
function mpClientStart(d){
 const s=d.s&&d.s[MP.myPeer];if(!s){toast('Игра уже началась, свободных мест нет');return;}
 MP.on=true;MP.started=true;diff=d.diff||1;
 const humans=[1].concat(Object.values(d.s));
 newGame({seed:d.seed,slot:s,cols:d.cols,skins:d.sk,humans,diff});
 for(const k of humans)P[k].human=true;
 MP.lastSnap=performance.now();startCaptureNoReset();
}
function startCaptureNoReset(){
 $('scr').hidden=true;$('ov').hidden=true;buildToolbar();startCapture();
 MP.snapT=0;MP.band=0;MP.blT=0;
}
function mpLeave(){
 try{if(MP.room)MP.room.leave();}catch(e){}
 MP.room=null;MP.on=false;MP.host=false;MP.started=false;MP.slots={};MP.paintBuf=[];ME=1;WSEED=null;mpNotice='';
}
function mpMenuButtons(){
 const el=$('mpBox');if(!el)return;
 el.innerHTML='<input id="mpCode" maxlength="12" placeholder="код комнаты" autocomplete="off" style="flex:1;min-width:0;padding:9px;background:var(--panel2);color:var(--fg);border:2px solid var(--line);font:600 15px var(--f1)"><button id="mpMake">Создать</button><button id="mpJoin">Войти</button>';
 const code=()=>$('mpCode').value;
 $('mpMake').onclick=()=>{let c=$('mpCode').value.trim();if(!c){c=Math.random().toString(36).slice(2,6);$('mpCode').value=c;}mpOpen(c,true);};
 $('mpJoin').onclick=()=>mpOpen(code(),false);
 mpStatus();

/* ===== Быстрый матч: общая очередь, один из игроков становится хостом ===== */

const SU={seed:0,slot:1,diff:1,size:0};
function newPreview(cb){
 SU.seed=(Math.random()*1e9)|0;
 loading('Генерируем карту…',()=>{newGame({seed:SU.seed,size:SU.size});SU.slot=1+((rng()*NN)|0);if(cb)cb();});
}
function drawPreview(){
 const cv=$('pv');if(!cv)return;const c=cv.getContext('2d');c.imageSmoothingEnabled=false;c.drawImage(miniT,0,0,cv.width,cv.height);
 const sx=cv.width/W,sy=cv.height/H,big=NN>8,huge=NN>=32;
 for(let k=1;k<=NN;k++){
  const x=(SC[k].x+.5)*sx,y=(SC[k].y+.5)*sy,sel=k==SU.slot,rr=huge?(sel?8:4.5):big?(sel?10:6):(sel?11:7);
  c.beginPath();c.arc(x,y,rr,0,7);c.fillStyle=sel?(PAL.find(p=>p.id==PF.color)||PAL[0]).h:'rgba(20,24,40,.85)';c.fill();
  c.lineWidth=sel?3:2;c.strokeStyle=sel?'#fff':'#9aa3c0';c.stroke();
  c.fillStyle=sel?'#111':'#fff';c.font='700 '+(huge?(sel?9:0.01):big?(sel?11:8):(sel?13:10))+'px Pixelify Sans,monospace';c.textAlign='center';c.textBaseline='middle';c.fillText(String(k),x,y+1);
 }
}
function skinSwatch(cv,id,col){
 const c=cv.getContext('2d'),w=cv.width,h=cv.height,base=[1,3,5].map(i=>parseInt(col.substr(i,2),16));
 const cs=4;for(let y=0;y<Math.floor(h/cs);y++)for(let x=0;x<Math.floor(w/cs);x++){c.fillStyle=rgbs(skinRGB(id,base,x,y));c.fillRect(x*cs,y*cs,cs,cs);}
 c.strokeStyle=col;c.lineWidth=3;c.strokeRect(1.5,1.5,w-3,h-3);
}

 $('newMap').onclick=()=>newPreview(drawPreview);

 wireSeg('sdf',i=>{SU.diff=i;PF.set.diff=i;savePF();});

 wireSeg('sq',i=>{S.q=i;TSp=[3,5,8][i];fitTS();savePF();loading('Применяем графику…',()=>{if(tilesSeed>=0){paintTerrain();}});});
 wireSeg('sp',i=>{S.part=i;savePF();});wireSeg('ss',i=>{S.shadow=i;savePF();});wireSeg('sw',i=>{S.water=i;savePF();});
 wireSeg('sc',i=>{S.clouds=i;savePF();});wireSeg('sn',i=>{S.night=i;savePF();});wireSeg('sg',i=>{S.grid=i;savePF();});
 wireSeg('sk',i=>{S.shake=i;savePF();});wireSeg('sf',i=>{S.fps=i;savePF();});wireSeg('sd',i=>{S.snd=i;sndOn=!!i;sndIcon();savePF();});
 let armed=false;$('rst').onclick=()=>{if(!armed){armed=true;$('rst').textContent='Нажмите ещё раз';$('rstT').textContent='Будут стёрты монеты, покупки, достижения и настройки.';return;}resetPF();applySettings();toast('Прогресс сброшен');showSettings(back);};
}
/* ===== пауза и конец игры ===== */
function pauseMenu(){
 if(phase!='play'&&phase!='cap')return;
 if(!MP.on)paused=true;
 card('Пауза','<p>'+(MP.on?'В онлайне игра идёт без паузы.':'Игра на паузе.')+'</p>','Продолжить',()=>{$('ov').hidden=true;paused=false;},'Выйти в меню',()=>{
  card('Выйти в меню?','<p>Текущий бой будет потерян.</p>','Выйти',()=>{$('ov').hidden=true;leaveToMenu();},'Назад',pauseMenu);
 });
}
function leaveToMenu(){mpLeave();paused=false;phase='intro';MISSION=null;$('goal').hidden=true;$('count').hidden=true;newGame({paint:false,seed:worldSeed,size:curSize});$('dipBox').hidden=true;$('goal').className='';TUT={i:0,shown:-1};refreshTools();showHome();}
function showEnd(win,r){
 r=r||{coins:0,lines:[],stars:0};
 setTimeout(()=>{
  const stars=r.stars?'<div class="stars">'+[1,2,3].map(n=>'<i class="'+(n<=r.stars?'on':'')+'"></i>').join('')+'</div>':'';
  const tutm=MISSION&&MISSION.type=='tut',camp=MISSION&&!MP.on&&!tutm;let nextI=camp?MISSION.idx+1:-1;
  const html=(mpNotice?'<p>'+mpNotice+'.</p>':'')+'<p>'+(win?(camp?'Задача выполнена.':'Все вражеские столицы уничтожены или присоединены.'):'Ваша столица уничтожена. Страна пала.')+'</p>'+stars+'<p>Время боя: '+Math.floor(gameT/60)+' мин '+Math.floor(gameT%60)+' с.</p><div class="rew">'+r.lines.map(l=>'<div>'+l+'</div>').join('')+'<div class="tot">Монет получено: '+r.coins+'</div></div>';
  if(tutm)card('ОБУЧЕНИЕ ПРОЙДЕНО','<p>Вы освоили основы: захват, постройки, штурм, ПВО и союзы. Дальше можно играть в королевскую битву или проходить кампанию.</p><div class="rew">'+r.lines.map(l=>'<div>'+l+'</div>').join('')+'<div class="tot">Монет получено: '+r.coins+'</div></div>','В меню',()=>{$('ov').hidden=true;leaveToMenu();});
  else if(camp&&win&&nextI<LEVELS.length)card('ПОБЕДА',html,'Следующий уровень',()=>{$('ov').hidden=true;showLevelIntro(nextI);},'В меню',()=>{$('ov').hidden=true;leaveToMenu();});
  else if(camp&&!win)card('ПОРАЖЕНИЕ',html,'Повторить',()=>{$('ov').hidden=true;startBattle(levelCfg(MISSION.idx));},'В меню',()=>{$('ov').hidden=true;leaveToMenu();});
  else card(win?'ПОБЕДА':'ПОРАЖЕНИЕ',html,'В меню',()=>{$('ov').hidden=true;leaveToMenu();});
 },1300);
}
/* ===== старт боя ===== */
function startCapture(){
 $('ov').hidden=true;$('scr').hidden=true;phase='cap';capT=5;$('count').hidden=false;$('wrap').classList.add('cap');
 const c=SC[ME];cam.cx=c.x+.5;cam.cy=c.y+.5;cam.z=Math.max(fitZ,Math.min(cw,ch)/24);camGoal=null;speed=1;$('bSpd').textContent='×1';setTool('hand');$('hint').textContent='';snd(440,.15,'square',.05,880);
 if(!MP.on)track('games');
 refreshTools();paused=false;
}
function endCapture(){
 phase='play';$('count').hidden=true;$('wrap').classList.remove('cap');recount();
 const c=SC[ME];camGoal={cx:c.x+.5,cy:c.y+.5,z:Math.max(fitZ,Math.min(cw,ch)/32)};
 toast('Захвачено '+Math.round(P[ME].tiles/landTotal*100)+'% суши. Стройте экономику и ПВО!');
 setTool('hand');hud();snd(660,.3,'triangle',.06,330);
}
/* ===== ввод ===== */
const pts=new Map();let moved=0,lastPaint=null,pinchD=0,downT=0;
function lp(e){const r=cvs.getBoundingClientRect();return{x:(e.clientX-r.left)*(cw/r.width),y:(e.clientY-r.top)*(ch/r.height)};}
function tileAt(p){const w=s2w(p.x,p.y);return{x:Math.floor(w.x),y:Math.floor(w.y),wx:w.x,wy:w.y};}
function setHover(p){
 if(phase!='play'||!brush){hover=null;return;}
 const t=tileAt(p);if(t.x<0||t.y<0||t.x>=W||t.y>=H){hover=null;return;}
 hover={x:t.x,y:t.y,ok:canPlace(ME,brush,t.x,t.y)===''};
}
cvs.addEventListener('pointerdown',e=>{
 e.preventDefault();cvs.setPointerCapture(e.pointerId);const p=lp(e);pts.set(e.pointerId,p);
 if(pts.size==1){moved=0;downT=performance.now();}
 if(pts.size==2){const v=[...pts.values()];pinchD=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);moved=99;}
 if(phase=='cap'&&pts.size==1){lastPaint=s2w(p.x,p.y);paintMe(lastPaint.x,lastPaint.y,1.6);}
 else if(pts.size==1)setHover(p);
});
cvs.addEventListener('pointermove',e=>{
 const p=lp(e);
 if(e.pointerType=='mouse'&&!pts.size)setHover(p);
 if(!pts.has(e.pointerId))return;
 const prev=pts.get(e.pointerId);pts.set(e.pointerId,p);
 if(phase=='cap'){
  const w=s2w(p.x,p.y);
  if(lastPaint){const dx=w.x-lastPaint.x,dy=w.y-lastPaint.y,n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/.5));for(let i=1;i<=n;i++)paintMe(lastPaint.x+dx*i/n,lastPaint.y+dy*i/n,1.6);}
  lastPaint=w;return;
 }
 if(pts.size==2){const v=[...pts.values()],d=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);if(pinchD>0)zoomAt((v[0].x+v[1].x)/2,(v[0].y+v[1].y)/2,d/pinchD);pinchD=d;moved=99;}
 else{moved+=Math.hypot(p.x-prev.x,p.y-prev.y);if(moved>10){cam.cx-=(p.x-prev.x)/cam.z;cam.cy-=(p.y-prev.y)/cam.z;clampCam();camGoal=null;hover=null;}else setHover(p);}
});
function up(e,cancel){
 const had=pts.has(e.pointerId),single=pts.size==1;pts.delete(e.pointerId);pinchD=0;
 if(phase=='cap'){lastPaint=null;return;}
 if(!cancel&&had&&single&&moved<=10&&phase=='play')tap(lp(e));
}
cvs.addEventListener('pointerup',e=>up(e,false));
cvs.addEventListener('pointercancel',e=>up(e,true));
cvs.addEventListener('wheel',e=>{e.preventDefault();const p=lp(e);zoomAt(p.x,p.y,e.deltaY<0?1.18:.85);},{passive:false});
cvs.addEventListener('contextmenu',e=>e.preventDefault());
$('zin').onclick=()=>zoomAt(cw/2,ch/2,1.35);
$('zout').onclick=()=>zoomAt(cw/2,ch/2,.74);
function mmMove(e){const r=mmc.getBoundingClientRect();cam.cx=(e.clientX-r.left)/r.width*W;cam.cy=(e.clientY-r.top)/r.height*H;clampCam();camGoal=null;}
let mmDown=false;
mmc.addEventListener('pointerdown',e=>{e.preventDefault();mmc.setPointerCapture(e.pointerId);mmDown=true;mmMove(e);});
mmc.addEventListener('pointermove',e=>{if(mmDown)mmMove(e);});
mmc.addEventListener('pointerup',()=>{mmDown=false;});
mmc.addEventListener('pointercancel',()=>{mmDown=false;});
function tap(p){
 const t=tileAt(p),x=t.x,y=t.y;
 if(x<0||y<0||x>=W||y>=H)return;
 if(tool=='hand'){
  const bi=BLD[y*W+x];
  if(bi>=0&&B[bi].o==ME){const b=B[bi];selB=b;TUTF.tapped=true;const nm=b.cap?'Столица':BT[b.t].n;const need=Math.ceil((b.max-b.hp)*.5*(1-.3*tk(ME,'fort2')));showInfo(nm+': '+Math.ceil(b.hp)+'/'+b.max+' HP',need>0?'Починить '+need:'','repair');}
  else if(bi>=0){const b=B[bi];showInfo((b.cap?'Столица':BT[b.t].n)+' · '+NAMES[b.o],'','');selB=b;}
  else closeInfo();
  return;
 }
 if(brush){const m=doAct('place',{t:brush,x,y});if(m)toast(m);hud();return;}
 aim.on=true;aim.tx=t.wx;aim.ty=t.wy;if(tool=='assault'||tool=='tank'||tool=='rpg'||tool=='howitzer'){aim.tx=x+.5;aim.ty=y+.5;}aimCheck();
}
/* ===== цикл и запуск ===== */
let lastT=0,menuT=0,upMs=1,lastF=0,fAvg=16,fN=0;
function goHome(){const c=SC[ME];if(!c)return;camGoal={cx:c.x+.5,cy:c.y+.5,z:Math.max(fitZ,Math.min(cw,ch)/28)};snd(520,.06,'square',.03);}
$('bHome').onclick=goHome;
if(document.addEventListener)document.addEventListener('visibilitychange',()=>{if(document.hidden&&phase=='play'&&!MP.on&&!paused&&$('ov').hidden)pauseMenu();});
function frame(t){
 const dt=Math.min(.05,(t-lastT)/1000||0);lastT=t;mpTick(dt);
 if(camGoal){const k=Math.min(1,dt*3);cam.cx+=(camGoal.cx-cam.cx)*k;cam.cy+=(camGoal.cy-cam.cy)*k;cam.z+=(camGoal.z-cam.z)*k;clampCam();if(Math.abs(camGoal.z-cam.z)<.03&&Math.abs(camGoal.cx-cam.cx)<.1)camGoal=null;}
 if(phase=='intro'){menuT+=dt;cam.z=Math.max(cw/W,ch/H)*(1.08+Math.sin(menuT*.25)*.05);cam.cx=W/2+Math.sin(menuT*.2)*12;cam.cy=H/2+Math.cos(menuT*.17)*6;clampCam();}
 if(!paused||MP.on){
  if(phase=='play'&&(!MP.on||MP.host))evTick(dt*(MP.on?1:speed));
  if(MP.on&&!MP.host)updateClient(dt);else{let steps=phase=='play'&&!MP.on?speed:1;if(steps>1)steps=Math.max(1,Math.min(steps,Math.floor(22/Math.max(1,upMs))));const t0=performance.now();for(let i=0;i<steps;i++)update(dt);upMs=upMs*.9+(performance.now()-t0)/steps*.1;}
 }
 if(phase=='cap'){if(!MP.on||MP.host)recount();hud();$('cT').textContent=Math.max(0,capT).toFixed(1);$('cB').style.width=Math.max(0,capT)/5*100+'%';}
 render(t);
 if(phase=='play'||phase=='cap'){const fd=t-lastF;lastF=t;if(fd>0&&fd<250){fAvg=fAvg*.95+fd*.05;if(++fN>150&&fAvg>26&&dpr>1.5){fN=0;fAvg=16;dprCap=dpr>2.2?2:1.5;resize();clampCam();}}}else{fN=0;}
 requestAnimationFrame(frame);
}
window.addEventListener('resize',()=>{resize();clampCam();});
(function boot(){
 const auto=accAuto();if(auto)autoQ();
 applySettings();resize();
 buildToolbar();
 const sd=(Math.random()*1e9)|0;
 genTiles(sd);tilesSeed=sd;worldSeed=sd;paintMini();paintTerrain();
 newGame({seed:sd,paint:false});
 if(auto)showHome();else showAuth();
 hud();setInterval(hud,250);requestAnimationFrame(frame);
})();
</script>
